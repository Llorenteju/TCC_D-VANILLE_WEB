
name: dvanille

description: Protótipo web/mobile da D'Vanille — versão Flutter fiel ao protótipo HTML

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.2.0
  image_picker: ^1.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5

dependency_overrides:
  image: 4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: CreamCake
      fonts:
        - asset: assets/fonts/CreamCake.otf

    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
          weight: 400
        - asset: assets/fonts/DancingScript-Medium.ttf
          weight: 500
        - asset: assets/fonts/DancingScript-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DancingScript-Bold.ttf
          weight: 700

  assets:
    - assets/images/logoreal.svg
    - assets/images/rodape.svg
    - assets/images/fachada_DVanille.png
    - assets/images/instalogo.svg
    - assets/images/cafeteriainterna.png
    - assets/images/bolo.svg
    - assets/images/salgado.svg
    - assets/images/doce.svg
    - assets/images/sobremesagelada.svg
    - assets/images/bebidaquente.svg
    - assets/images/bebidagelada.svg
    - assets/images/cadeado.svg
    - assets/images/presente.svg
    - assets/images/lupa.svg
    - assets/images/palmas.svg
    - assets/images/sacola_lacinho.png
    - assets/images/carrinho.svg
    - assets/images/lixeira.svg
    - assets/images/cupom.svg
    - assets/images/agenda.svg
    - assets/images/confete.svg
    - assets/images/app.svg
    - assets/images/trocarsenha.svg
    - assets/images/tchau.svg
    - assets/images/comanda_mesa.svg
    - assets/images/pedidos.svg
    - assets/images/produtos.svg
    - assets/images/dashboard.svg
    - assets/images/perfil.svg
    - assets/images/ofertas.svg